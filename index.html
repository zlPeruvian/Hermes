0216%20304%20218%20M256%20238%20C242%20224%20224%20216%20208%20218%22%20stroke=%22%23FFE24D%22%20stroke-width=%2215%22/%3E%3C/g%3E%3Cg%20fill=%22%23FFE24D%22%3E%3Ccircle%20cx=%22308%22%20cy=%22218%22%20r=%2211%22/%3E%3Ccircle%20cx=%22204%22%20cy=%22218%22%20r=%2211%22/%3E%3C/g%3E%3Cg%20fill=%22%2317233B%22%3E%3Ccircle%20cx=%22311%22%20cy=%22215%22%20r=%223%22/%3E%3Ccircle%20cx=%22201%22%20cy=%22215%22%20r=%223%22/%3E%3C/g%3E%3Ccircle%20cx=%22256%22%20cy=%22136%22%20r=%2222%22%20fill=%22%23FFE24D%22/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#E4E9F0; --ink:#17233B; --muted:#5A6578; --line:#D3DAE4;
  --accent:#2F4BC6; --accent-ink:#FFFFFF; --soft:#DDE4FB; --mark:#FFE24D; --ok:#1E8068; --warn:#C4432F;
  --serif:'Newsreader',Georgia,'Times New Roman',serif; --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E2F; --surface2:#222B40; --ink:#E7ECF6; --muted:#98A3B8; --line:#2B3550;
    --accent:#8CA2FF; --accent-ink:#0E1320; --soft:#25305A; --mark:#7A6A12; --ok:#4FC3A1; --warn:#FF8E7A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2F; --surface2:#222B40; --ink:#E7ECF6; --muted:#98A3B8; --line:#2B3550;
  --accent:#8CA2FF; --accent-ink:#0E1320; --soft:#25305A; --mark:#7A6A12; --ok:#4FC3A1; --warn:#FF8E7A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
h1{font-size:30px;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 14px}
.sub{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:500;min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:14px;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.tema{color:var(--muted)}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:0 12px;min-height:52px}
.searchbox svg{width:20px;height:20px;flex:none}
.searchbox input{flex:1;border:0;background:transparent;outline:none;min-height:48px;font-size:17px;min-width:0}
.searchbox button{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.filters select{font-size:15px;padding:10px 8px}
select,input[type=text],input[type=date],input[type=number],input:not([type]),textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea{resize:vertical;line-height:1.5}
label.f{display:block;font-size:14px;color:var(--muted);margin:16px 0 6px}
.lead{font-family:var(--serif);font-size:19px;color:var(--ink)}
.count{font-size:14px;color:var(--muted);margin:18px 0 8px}

/* fichas: tarjetas con lomo de color según el tipo */
.ficha{background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:14px 14px 10px;margin:0 0 12px}
.ficha.tx{border-left-color:#E5B800}
.ficha.pa{border-left-color:var(--accent)}
.ficha.id{border-left-color:var(--ok)}
.ficha .tipo{font-size:13px;color:var(--muted);margin-bottom:6px}
.ficha .nota{font-family:var(--serif);font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ficha.id .nota{font-style:italic}
.hl{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ficha .src{font-size:14px;color:var(--muted);margin-top:8px}
.ficha .src b{color:var(--ink);font-weight:600}
.coment{margin-top:10px;padding:8px 10px;border-left:2px dashed var(--muted);background:var(--surface2);border-radius:0 6px 6px 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.coment span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.ficha.clamp .coment{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.temas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tema{font-size:13px;color:var(--muted);background:var(--surface2);border:0;border-radius:6px;padding:3px 8px}
.usos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.uso{font-size:13px;border-radius:6px;padding:3px 8px;background:var(--soft)}
.uso.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.uso.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.ficha.clamp .nota{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

/* libros y proyectos: filas, no tarjetas */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:inherit}
.rowwrap{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.rowwrap .row{border-bottom:0;flex:1;min-width:0;width:auto}
.rowopen{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--accent)}
.rowopen:active{background:var(--soft)}
.rowgap{flex:none;width:48px}
.row .main{flex:1;min-width:0}
.row .t{font-family:var(--serif);font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.row .m{font-size:14px;color:var(--muted);margin-top:2px}
.row .side{font-size:13px;color:var(--muted);text-align:right;flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.leyendo{background:#E5B800}.dot.leido{background:var(--ok)}.dot.porleer{background:var(--muted)}.dot.parcial{background:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 18px;margin-top:18px}
.empty p{margin:0 0 12px}
.banner{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.banner select{margin-top:8px;color:var(--ink)}
.banner .btn{margin-top:8px}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;min-height:52px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent);font-weight:600}
.tab.add{color:var(--accent-ink)}
.tab.add span.pill{background:var(--accent);width:52px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.tab.add{color:var(--ink);font-weight:600}

/* hojas */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet.open{display:flex}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{font-size:20px;text-align:center;flex:1}
.sheet-body{flex:1;overflow:auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom,0px));width:100%;max-width:720px;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{margin:0;text-align:center;padding:11px 4px;background:var(--surface);cursor:pointer;font-size:15px;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{font-weight:600}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;align-items:stretch}
.inline select{flex:1;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.urow{border-top:1px solid var(--line);padding:10px 0}
.urow:first-child{border-top:0;padding-top:0}
.urow .n{font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
.urow .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:20px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stat b{font-weight:600}
.sec{margin-top:22px}
.sec h3{font-size:21px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3 small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:400}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mini select{min-height:38px;padding:6px 8px;font-size:14px}
/* visor de PDF */
.viewer{position:fixed;inset:0;z-index:40;background:var(--surface2);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer.open{display:flex}
.viewer .sheet-head h2{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vscroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 0}
.vpage{position:relative;margin:0 auto 8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.vpage canvas{display:block}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(47,75,198,.35)}
.vmsg{padding:24px;text-align:center}
.vbar{background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.vsel{font-size:13px;min-height:36px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vrow{display:flex;align-items:center;gap:8px}
.vrow .primary{margin-left:auto}
.vpgbox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.vpgbox input{width:64px;min-height:36px;padding:4px 8px;text-align:center}
/* lector de EPUB */
.echap{max-width:680px;margin:0 auto;padding:12px 16px 32px;background:var(--rbg);color:var(--rtx);font-family:var(--serif);font-size:var(--efs,18px);line-height:1.6;overflow-wrap:anywhere;min-height:100%}
.echap h1,.echap h2,.echap h3,.echap h4{line-height:1.25;margin:1.2em 0 .5em}
.echap p{margin:.7em 0}
.echap img,.echap svg{max-width:100%;height:auto;max-height:75vh}
.echap table{display:block;overflow-x:auto;max-width:100%}
.echap blockquote{margin:1em 0;padding-left:14px;border-left:3px solid currentColor;opacity:.85}
.echap a[data-h]{color:inherit;text-decoration:underline;cursor:pointer}
.echap .pb{display:inline-block;font:12px var(--sans);color:inherit;opacity:.65;background:rgba(128,128,128,.22);border-radius:4px;padding:0 5px;margin:0 3px;-webkit-user-select:none;user-select:none}
.enav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
/* resaltado de fragmentos con ficha */
mark.hl{background:rgba(255,214,0,.45);color:inherit;border-radius:2px;padding:0;cursor:pointer}
.textLayer mark.hl{background:rgba(255,214,0,.5);color:transparent;mix-blend-mode:multiply}
.brand{display:flex;align-items:center;gap:12px;padding:12px 0 0;font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.2px}
.brand svg{width:40px;height:40px;flex:none;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
/* lectura a pantalla completa */
.viewer.reading .sheet-head,.viewer.reading #voff{display:none}
.viewer.reading .vbar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:2;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.viewer.reading.sel .vbar{display:block}
.vexit{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:3;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);opacity:.5;align-items:center;justify-content:center}
.viewer.reading .vexit{display:flex}
.vexit:active{opacity:1}
/* colores de lectura */
.viewer{--rbg:#FFFFFF;--rtx:#000000}
.viewer[data-tema=negro]{--rbg:#000000;--rtx:#FFFFFF}
.viewer[data-tema=beige]{--rbg:#F4ECD8;--rtx:#3B2A1E}
.viewer[data-tema=lila]{--rbg:#E6DDF5;--rtx:#000000}
.viewer .vscroll{background:var(--rbg)}
.viewer .vpage{background:var(--rbg);isolation:isolate;box-shadow:0 0 0 1px rgba(128,128,128,.35)}
.viewer[data-tema=negro] .vpage canvas{filter:invert(1) hue-rotate(180deg)}
.viewer[data-tema=beige] .vpage canvas,.viewer[data-tema=lila] .vpage canvas{mix-blend-mode:multiply}
.viewer[data-tema=beige] .vpage::after{content:'';position:absolute;inset:0;background:var(--rtx);mix-blend-mode:lighten;pointer-events:none}
.viewer[data-tema=negro] .textLayer mark.hl{mix-blend-mode:screen;background:rgba(255,214,0,.4)}
.viewer[data-tema=negro] .textLayer ::selection{background:rgba(120,150,255,.45)}
.viewer[data-tema=negro] .echap mark.hl{background:rgba(255,214,0,.32)}
.vtheme{right:58px}
.vpbk{position:absolute;inset:0;z-index:4}
.vpanel{position:absolute;z-index:5;top:calc(56px + env(safe-area-inset-top,0px));right:10px;width:min(320px,calc(100% - 20px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.vphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.vlabel{font-size:13px;color:var(--muted);margin-bottom:8px}
.vsws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vsw{border:2px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px}
.vsw b{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1}
.vsw span{font-size:12px}
.vsw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
/* foto del texto */
.ocrrow{display:flex;align-items:center;gap:14px;margin:8px 0 2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function(){
'use strict';

/* ---------- constantes y utilidades ---------- */
var TIPOS=['Textual','Paráfrasis','Idea propia'];
var PRIOS=['1-Alta','2-Media','3-Baja'];
var ESTADOS_LECT=['Por leer','Leyendo','Leído','Consulta parcial'];
var FORMATOS=['PDF','Ebook','Físico'];
var TIPOS_OBRA=['Libro','Capítulo','Artículo','Tesis','Otro'];
var ESTADOS_PROY=['Activo','Pausado','Terminado'];
var $=function(s,el){return (el||document).querySelector(s)};
var $$=function(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var pl=function(n,a,b){return n+' '+(n===1?a:b)};
var today=function(){return new Date().toISOString().slice(0,10)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var ICON={
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  book:'<path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'
};
var svg=function(k){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+ICON[k]+'</svg>'};

/* ---------- datos ---------- */
var S={libros:[],fichas:[],proyectos:[]};
var LS='cuaderno-lecturas-v1';
var localAtLoad={libros:[],fichas:[],proyectos:[]};
try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);['libros','fichas','proyectos'].forEach(function(k){S[k]=Array.isArray(o[k])?o[k]:[]});localAtLoad=clone(S)}}catch(e){}
function mirror(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
var Store={base:null,cloud:false,status:'Conectando con tu cuenta…'};
var Qs=new Map();
function enqueue(key,fn){var p=(Qs.get(key)||Promise.resolve()).catch(function(){}).then(fn);Qs.set(key,p);return p}
function onErr(e){
  var code=e&&e.code;
  var msg=code==='quota_exceeded'?'Se llenó el espacio de la base de datos. Exporta un respaldo y borra datos que no uses.':
          code==='resource_exhausted'?'Demasiadas operaciones seguidas. Espera un momento.':
          'No se pudo guardar en tu cuenta. Los datos siguen en este dispositivo.';
  toast(msg);
}
function persist(col,obj){
  var copy=clone(obj);var i=S[col].findIndex(function(x){return x.id===copy.id});
  if(i>=0)S[col][i]=copy;else S[col].push(copy);
  mirror();scheduleRender();
  if(Store.base)return enqueue(col+copy.id,function(){return Store.base.collection(col).doc(copy.id).set(copy)}).catch(onErr);
  return Promise.resolve();
}
function removeDoc(col,id){
  S[col]=S[col].filter(function(x){return x.id!==id});
  mirror();scheduleRender();
  if(Store.base)return enqueue(col+id,function(){return Store.base.collection(col).doc(id).delete()}).catch(onErr);
  return Promise.resolve();
}
var migrated=false;
async function maybeMigrate(){
  var cloudTotal=S.libros.length+S.fichas.length+S.proyectos.length;
  var localTotal=localAtLoad.libros.length+localAtLoad.fichas.length+localAtLoad.proyectos.length;
  if(cloudTotal===0&&localTotal>0){
    S=clone(localAtLoad);scheduleRender();
    var cols=['libros','fichas','proyectos'];
    for(var c=0;c<cols.length;c++){for(var i=0;i<S[cols[c]].length;i++){await persist(cols[c],S[cols[c]][i]);if(i%20===19)await sleep(60)}}
    toast('Tus datos de este dispositivo se subieron a tu cuenta');
  }
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use){Store.status='Solo en este dispositivo';return}
    var db=await window.claude.use('db');var user=await window.claude.use('user');
    var id=user?await user.id():null;
    if(!db||!id){Store.status='Solo en este dispositivo';scheduleRender();return}
    Store.base=db.doc('data/users/'+id+'/app');Store.cloud=true;Store.status='Sincronizado con tu cuenta';
    var first={};
    ['libros','fichas','proyectos'].forEach(function(col){
      Store.base.collection(col).onSnapshot(function(snap){
        if(snap.metadata.fromCache&&snap.empty){return}
        S[col]=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});
        mirror();
        if(!snap.metadata.fromCache){first[col]=true;if(!migrated&&first.libros&&first.fichas&&first.proyectos){migrated=true;maybeMigrate()}}
        scheduleRender();
      },function(e){onErr(e)});
    });
  }catch(e){Store.status='Solo en este dispositivo'}
  scheduleRender();
}

/* ---------- helpers de dominio ---------- */
var libroById=function(id){return S.libros.find(function(l){return l.id===id})};
var proyById=function(id){return S.proyectos.find(function(p){return p.id===id})};
var fichaById=function(id){return S.fichas.find(function(f){return f.id===id})};
function pgLabel(p){p=String(p||'').trim();if(!p)return '';if(/^\d+\s*[-–]\s*\d+$/.test(p))return 'pp. '+p;if(/^\d/.test(p))return 'p. '+p;return p}
function citaCorta(l,pag){if(!l)return '';var s=(l.apellido||'s. a.')+', '+(l.anio||'s. f.');var g=pgLabel(pag);return s+(g?', '+g:'')}
function citaLista(f){
  var n=String(f.nota||'').trim();var l=libroById(f.libro);
  if(f.tipo==='Idea propia'||!l)return n;
  var src=citaCorta(l,f.pagina);
  if(f.tipo==='Textual')return '“'+n+'” ('+src+')';
  return n.replace(/[.\s]+$/,'')+' ('+src+').';
}
function referencia(l){
  var a=l.autor||l.apellido||'';
  return [a,l.anio?'('+l.anio+').':'(s. f.).',l.titulo?l.titulo+'.':'',l.editorial?l.editorial+'.':''].filter(Boolean).join(' ').replace(/\.\./g,'.');
}
function genClave(apellido,anio,excludeId){
  var base=(String(apellido||'').trim().split(/[\s,]+/)[0]||'Autor')+(anio||'sf');var c=base;var i=0;
  var taken={};S.libros.forEach(function(l){if(l.id!==excludeId)taken[norm(l.clave)]=1});
  while(taken[norm(c)]){c=base+String.fromCharCode(97+i++)}
  return c;
}
function parseTemas(v){var seen={},out=[];String(v||'').split(/[,;]/).forEach(function(t){t=t.trim().toLowerCase();if(t&&!seen[t]){seen[t]=1;out.push(t)}});return out}
function usoDe(f,pid){return (f.usos||[]).find(function(u){return u.p===pid})}
function libroHay(l){return norm([l.clave,l.apellido,l.autor,l.titulo,l.editorial,l.anio,(l.temas||[]).join(' '),l.resumen].join(' '))}
function fichaHay(f){
  var l=libroById(f.libro);
  var ps=(f.usos||[]).map(function(u){var p=proyById(u.p);return p?p.nombre:''}).join(' ');
  return norm([f.nota,f.comentario,(f.temas||[]).join(' '),f.pagina,l?libroHay(l):'',ps].join(' '));
}
function topTemas(n){
  var c={};S.fichas.forEach(function(f){(f.temas||[]).forEach(function(t){c[t]=(c[t]||0)+1})});
  S.libros.forEach(function(l){(l.temas||[]).forEach(function(t){c[t]=(c[t]||0)+1})});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b)}).slice(0,n);
}
function topAutores(n){
  var c={};S.libros.forEach(function(l){if(!l.apellido)return;var k=l.apellido;var cnt=S.fichas.filter(function(f){return f.libro===l.id}).length;c[k]=(c[k]||0)+1+cnt});
  return Object.keys(c).sort(function(a,b){return c[b]-c[a]||a.localeCompare(b)}).slice(0,n);
}
var fichasDeLibro=function(id){return S.fichas.filter(function(f){return f.libro===id})};

/* ---------- avisos y portapapeles ---------- */
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2400)}
async function copyText(txt,msg){
  try{await navigator.clipboard.writeText(txt);toast(msg||'Copiado');return}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?(msg||'Copiado'):'No se pudo copiar')}catch(e){toast('No se pudo copiar')}
}
function hdb(){return new Promise(function(res,rej){var r=indexedDB.open('hermes-handles',1);r.onupgradeneeded=function(){r.result.createObjectStore('h')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function hGet(k){try{var d=await hdb();return await new Promise(function(res){var q=d.transaction('h').objectStore('h').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}catch(e){return null}}
async function hSet(k,v){try{var d=await hdb();await new Promise(function(res){var t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=res})}catch(e){}}
function mimeOf(n){return /\.xlsx$/i.test(n)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json'}
async function saveFile(filename,data){
  var blob=new Blob([data],{type:mimeOf(filename)});
  /* 1) dentro de Claude */
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:filename,data:data});toast('Archivo guardado');return}
  }catch(e){if(e&&e.code==='declined')return}
  /* 2) computadora: carpeta elegida una vez y recordada */
  if(window.showDirectoryPicker){
    try{
      var dir=await hGet('dir');
      if(dir){var pm=await dir.queryPermission({mode:'readwrite'});if(pm!=='granted')pm=await dir.requestPermission({mode:'readwrite'});if(pm!=='granted')dir=null}
      if(!dir){dir=await window.showDirectoryPicker({mode:'readwrite',id:'hermes'});await hSet('dir',dir)}
      var fh=await dir.getFileHandle(filename,{create:true});var w=await fh.createWritable();await w.write(blob);await w.close();
      toast('Guardado en la carpeta '+dir.name+': '+filename);return
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  /* 3) celular: descarga directa a la carpeta Descargas, sin preguntar */
  try{
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},10000);
    toast('Guardado en Descargas: '+filename);return
  }catch(e){}
  /* 4) último recurso: hoja de compartir */
  try{
    var f=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  toast('No se pudo guardar el archivo')
}

/* ---------- navegación y estado de vista ---------- */
var V={tab:'buscar',sub:null,q:'',scope:'todo',tipo:'',proj:'',limit:30,assign:null,libFilter:'',pf:'todas',pendingRestore:null,confirm:null};
var raf=0;
function scheduleRender(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;update()})}
function drawTabs(){
  var items=[['buscar','Buscar','search'],['libros','Libros','book'],['nuevo','Anotar','plus'],['proyectos','Proyectos','folder'],['mas','Más','more']];
  $('#tabs').innerHTML=items.map(function(t){
    if(t[0]==='nuevo')return '<button class="tab add" data-act="nuevo" aria-label="Anotar una ficha nueva"><span class="pill" style="color:var(--accent-ink)">'+svg('plus')+'</span>Anotar</button>';
    return '<button class="tab'+(V.tab===t[0]?' on':'')+'" data-act="tab" data-tab="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'>'+svg(t[2])+t[1]+'</button>';
  }).join('');
}
function go(tab,sub){V.tab=tab;V.sub=sub||null;V.confirm=null;mount();window.scrollTo(0,0)}
function mount(){
  drawTabs();
  if(V.tab==='buscar')mountBuscar();
  else if(V.tab==='libros')mountLibros();
  else if(V.tab==='proyectos')V.sub&&V.sub.proyecto?mountProyecto(V.sub.proyecto):mountProyectos();
  else mountMas();
}
function update(){
  if(V.tab==='buscar'){updateBuscar();return}
  var y=window.scrollY;mount();window.scrollTo(0,y);
}

/* ---------- tarjeta de ficha ---------- */
function comentHtml(f){return f.comentario?'<div class="coment"><span>Mi comentario</span>'+esc(f.comentario)+'</div>':''}
function fichaCard(f,o){
  o=o||{};
  var l=libroById(f.libro);var t=f.tipo||'Paráfrasis';
  var cls=t==='Textual'?'tx':t==='Idea propia'?'id':'pa';
  var nota=t==='Textual'?'<span class="hl">'+esc(f.nota)+'</span>':esc(f.nota);
  var src=l?'<b>'+esc(citaCorta(l,f.pagina))+'</b>'+(l.titulo?', '+esc(l.titulo):''):(t==='Idea propia'?'Sin libro':'<em>Libro no encontrado</em>');
  var temas=(f.temas||[]).map(function(x){return '<button class="tema" data-act="q" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
  var usos=(f.usos||[]).map(function(u){var p=proyById(u.p);return '<span class="uso'+(u.e==='Usada'?' ok':'')+'">'+esc(p?p.nombre:'Proyecto eliminado')+': '+esc((u.e||'Pendiente').toLowerCase())+'</span>'}).join('');
  if(!usos)usos='<span class="uso none">Sin usar en ningún proyecto</span>';
  var acts='<button class="link" data-act="copiar" data-id="'+f.id+'">Copiar cita</button>';
  if(o.assign){
    var ya=!!usoDe(f,o.assign.p);
    acts+='<button class="link" data-act="assign-toggle" data-id="'+f.id+'">'+(ya?'Quitar del proyecto':'Añadir al proyecto')+'</button>';
  }
  acts+=pdfLink(f);
  acts+='<button class="link" data-act="ficha-edit" data-id="'+f.id+'">Editar y asignar</button>';
  return '<article class="ficha '+cls+'"><div class="tipo">'+esc(t)+'</div><div class="nota">'+nota+'</div><div class="src">'+src+'</div>'+comentHtml(f)+
    (temas?'<div class="temas">'+temas+'</div>':'')+'<div class="usos">'+usos+'</div><div class="acts">'+acts+'</div></article>';
}

/* ---------- BUSCAR ---------- */
function mountBuscar(){
  $('#main').innerHTML=
   '<div class="top"><h1>Buscar</h1></div><div id="assignbar"></div>'+
   '<div class="searchbox">'+svg('search')+'<input id="q" type="search" placeholder="Tema, autor o palabra de la nota" autocomplete="off" aria-label="Buscar" value="'+esc(V.q)+'"><button id="qx" aria-label="Borrar búsqueda" style="display:'+(V.q?'block':'none')+'">×</button></div>'+
   '<div class="chips" id="scopes"></div><div class="filters"><select id="ftipo" aria-label="Tipo de ficha"></select><select id="fproj" aria-label="Proyecto"></select></div><div id="results"></div>';
  $('#q').addEventListener('input',function(e){V.q=e.target.value;V.limit=30;$('#qx').style.display=V.q?'block':'none';updateBuscar()});
  $('#qx').addEventListener('click',function(){V.q='';$('#q').value='';$('#qx').style.display='none';V.limit=30;updateBuscar();$('#q').focus()});
  updateBuscar();
}
function updateBuscar(){
  if(!$('#results'))return;
  // barra de asignación
  var ab='';
  if(V.assign){
    var p=proyById(V.assign.p);
    if(p){
      ab='<div class="banner"><div>Añadiendo fichas a <b>'+esc(p.nombre)+'</b></div><select id="asec" aria-label="Sección de destino"><option value="">Sin sección</option>'+
        (p.secciones||[]).map(function(s){return '<option value="'+esc(s)+'"'+(V.assign.s===s?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select>'+
        '<button class="btn small" data-act="assign-end">Terminar</button></div>';
    }else V.assign=null;
  }
  if($('#assignbar').innerHTML!==ab)$('#assignbar').innerHTML=ab;
  // chips de alcance
  $('#scopes').innerHTML=[['todo','Todo'],['fichas','Fichas'],['libros','Libros']].map(function(s){return '<button class="chip'+(V.scope===s[0]?' on':'')+'" data-act="scope" data-v="'+s[0]+'">'+s[1]+'</button>'}).join('');
  // filtros
  var ft=$('#ftipo'),fp=$('#fproj');
  var tOpts='<option value="">Cualquier tipo</option>'+TIPOS.map(function(t){return '<option'+(V.tipo===t?' selected':'')+'>'+t+'</option>'}).join('');
  if(ft.innerHTML!==tOpts)ft.innerHTML=tOpts;
  var pOpts='<option value="">Cualquier proyecto</option><option value="__none"'+(V.proj==='__none'?' selected':'')+'>Sin usar en ningún proyecto</option>'+
    S.proyectos.map(function(p){return '<option value="'+p.id+'"'+(V.proj===p.id?' selected':'')+'>'+esc(p.nombre)+'</option>'}).join('');
  if(fp.innerHTML!==pOpts)fp.innerHTML=pOpts;
  ft.value=V.tipo;fp.value=V.proj;

  var R=$('#results');
  if(!S.libros.length&&!S.fichas.length){
    R.innerHTML='<div class="empty"><p class="lead">Aún no hay nada en Hermes.</p><p class="sub">Registra un libro y empieza a anotar. Todo lo que guardes aquí se podrá buscar por tema, autor o palabra.</p><button class="btn primary" data-act="nuevo">Anotar la primera ficha</button> <button class="btn" data-act="tab" data-tab="libros">Registrar un libro</button></div>';
    return;
  }
  var tokens=norm(V.q).split(/\s+/).filter(Boolean);
  var hasFilter=!!(V.tipo||V.proj);
  if(!tokens.length&&!hasFilter){
    var tm=topTemas(14),au=topAutores(8);
    var recientes=S.fichas.slice().sort(function(a,b){return (b.creado||0)-(a.creado||0)}).slice(0,12);
    var h='';
    if(tm.length)h+='<div class="count">Temas frecuentes</div><div class="chips">'+tm.map(function(t){return '<button class="chip tema" data-act="q" data-q="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>';
    if(au.length)h+='<div class="count">Autores</div><div class="chips">'+au.map(function(t){return '<button class="chip" data-act="q" data-q="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>';
    h+='<div class="count">Últimas fichas</div>'+(recientes.length?recientes.map(function(f){return fichaCard(f,{assign:V.assign})}).join(''):'<p class="sub">Aún no hay fichas. Toca Anotar para crear la primera.</p>');
    R.innerHTML=h;return;
  }
  var matchTokens=function(hay){return tokens.every(function(t){return hay.indexOf(t)>=0})};
  var libs=[],fich=[];
  if((V.scope==='todo'||V.scope==='libros')&&!hasFilter)libs=S.libros.filter(function(l){return matchTokens(libroHay(l))});
  if(V.scope==='todo'||V.scope==='fichas'){
    fich=S.fichas.filter(function(f){
      if(V.tipo&&f.tipo!==V.tipo)return false;

    }).sort(function(a,b){return (b.creado||0)-(a.creado||0)});
  }
  var h2='';
  if(libs.length){
    h2+='<div class="count">'+pl(libs.length,'libro','libros')+'</div><div class="rows">'+libs.slice(0,V.limit).map(libroRow).join('')+'</div>';

  }
  if(fich.length>V.limit||libs.length>V.limit)h2+='<button class="btn" data-act="more" style="width:100%">Mostrar más</button>';
  if(!libs.length&&!fich.length)h2='<div class="empty"><p class="lead">Sin resultados.</p><p class="sub">Prueba con otra palabra, el apellido del autor o quita los filtros.</p></div>';
  R.innerHTML=h2;
}

function projItems(p){
  var secs=p.secciones||[];
  var items=S.fichas.filter(function(f){return usoDe(f,p.id)}).map(function(f){return {f:f,u:usoDe(f,p.id)}});
  var gi=function(x){var i=secs.indexOf(x.u.s);return i<0?secs.length:i};
  items.sort(function(a,b){return gi(a)-gi(b)||PRIOS.indexOf(a.u.pr||'2-Media')-PRIOS.indexOf(b.u.pr||'2-Media')||(a.f.creado||0)-(b.f.creado||0)});
  return items;
}
function bibDeProyecto(p){
  var seen={},refs=[];
  projItems(p).forEach(function(x){var l=libroById(x.f.libro);if(l&&!seen[l.id]){seen[l.id]=1;refs.push(referencia(l))}});
  return refs.sort(function(a,b){return norm(a).localeCompare(norm(b))});
}

  XLSX.utils.book_append_sheet(wb,sheetFrom(r,[24,10,10,12,60,40,60,14,10,24]),'Fichas');

}

/* ---------- VISOR DE PDF ---------- */
var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var POS='cuaderno-pdf-pos';
var PAGRE=/^\s*(?:pp?\.?\s*)?(\d+)\b/i;
var VW=null;

/* el PDF no se copia ni se guarda: se abre desde el dispositivo y solo se recuerda en memoria durante la sesión */
var PF=null,PEND=null;
try{indexedDB.deleteDatabase('cuaderno-pdf')}catch(e){}
/* archivos: referencia (si el navegador la permite) o copia opcional por libro */
var HH=new Map(),HC=new Map();
function hdb(){
  return hdb.p||(hdb.p=new Promise(function(res,rej){
    try{
      var r=indexedDB.open('cuaderno-archivos',2);
      r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('h'))d.createObjectStore('h',{keyPath:'id'});if(!d.objectStoreNames.contains('c'))d.createObjectStore('c',{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  }));
}
function hdo(mode,fn,st){
  st=st||'h';
  return hdb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(st,mode),rq=fn(tx.objectStore(st));
    tx.oncomplete=function(){res(rq?rq.result:undefined)};tx.onerror=tx.onabort=function(){rej(tx.error)};
  })});
}
hdo('readonly',function(s){return s.getAll()}).then(function(a){(a||[]).forEach(function(r){HH.set(r.id,r.kind);if(r.copy)HC.set(r.id,r.size||0)});scheduleRender()}).catch(function(){});
async function hMeta(id,patch){
  var old=null;try{old=await hdo('readonly',function(s){return s.get(id)})}catch(e){}
  var rec=Object.assign({id:id},old||{},patch);
  if(!rec.handle&&!rec.copy){await hdo('readwrite',function(s){return s.delete(id)});HH.delete(id);HC.delete(id);return}
  await hdo('readwrite',function(s){return s.put(rec)});
  HH.set(id,rec.kind);if(rec.copy)HC.set(id,rec.size||0);else HC.delete(id);
}
function kindOfFile(f){var n=f.name||'',t=f.type||'';return /\.epub$/i.test(n)||/epub/i.test(t)?'epub':(/\.pdf$/i.test(n)||/pdf/i.test(t))?'pdf':''}
function redrawPdfBlock(id){var b=$('#pdfblock');if(b)b.outerHTML=pdfBlock(id);scheduleRender()}
async function saveCopy(id,file){
  var k=kindOfFile(file);if(!k){toast('Elige un archivo PDF o EPUB');return}
  try{
    await hdo('readwrite',function(s){return s.put({id:id,blob:file,name:file.name})},'c');
    await hMeta(id,{kind:k,copy:true,size:file.size});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}
    redrawPdfBlock(id);toast('Copia guardada ('+(file.size/1048576).toFixed(1)+' MB)');
  }catch(e){toast('No se pudo guardar la copia. Quizá falta espacio.')}
}
async function askPdf(id,target,change){
  if(!change&&PF&&PF.id===id){openFile(id,target,PF.file);return}
  if(!change&&HC.has(id)){
    try{
      var c=await hdo('readonly',function(s){return s.get(id)},'c');
      if(c&&c.blob){openFile(id,target,new File([c.blob],c.name||'libro',{type:c.blob.type}));return}
    }catch(e){}
    toast('No se encontró la copia guardada. Elige el archivo de nuevo.');
  }
  if(!change&&HH.has(id)){
    try{
      var r=await hdo('readonly',function(s){return s.get(id)});
      if(r&&r.handle){
        var h=r.handle;
        if((await h.queryPermission({mode:'read'}))==='granted'||(await h.requestPermission({mode:'read'}))==='granted'){openFile(id,target,await h.getFile());return}
      }
    }catch(e){toast('No se pudo abrir el archivo guardado. Elígelo de nuevo.')}
  }
  if(window.showOpenFilePicker){
    try{
      var hs=await window.showOpenFilePicker({multiple:false,types:[{description:'PDF o EPUB',accept:{'application/pdf':['.pdf'],'application/epub+zip':['.epub']}}]});
      var fh=hs[0],file=await fh.getFile(),k=kindOfFile(file);
      if(k){try{await hMeta(id,{handle:fh,kind:k})}catch(e){toast('Este navegador no pudo recordar la ubicación del archivo.')}}
      openFile(id,target,file);return;
    }catch(e){if(e&&e.name==='AbortError')return}

/* ---------- RESALTADO DE FRAGMENTOS CON FICHA ---------- */
var HLRE=/[\s\-\u00ad\u2010\u2011]/;
function hlNorm(t){var o='';t=String(t);for(var i=0;i<t.length;i++){var c=t[i];if(!HLRE.test(c))o+=c.toLowerCase().charAt(0)}return o}
function hlChars(root){
  var out=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){
    var pe=n.parentElement;if(pe&&pe.closest('.pb,.enav'))continue;
    var t=n.nodeValue;
    for(var k=0;k<t.length;k++){var c=t[k];if(!HLRE.test(c))out.push({c:c.toLowerCase().charAt(0),n:n,k:k})}
  }
  return out;
}
/* posición (en caracteres normalizados) donde empieza la selección */
function hlStart(pe,rg){
  var root=pe.classList.contains('vpage')?pe.querySelector('.textLayer'):pe;
  if(!root)return -1;
  var chars=hlChars(root),lo=0,hi=chars.length;
  while(lo<hi){var mid=(lo+hi)>>1,e=chars[mid];if(rg.comparePoint(e.n,e.k)<0)lo=mid+1;else hi=mid}
  return lo<chars.length?lo:-1;
}
function hlFind(hay,h){
  var nd=hlNorm(h.t);if(nd.length<2)return null;
  var a=(typeof h.s==='number'&&h.s>=0&&hay.substr(h.s,nd.length)===nd)?h.s:hay.indexOf(nd);
  return a<0?null:[a,a+nd.length];
}
function hlWrap(chars,a,b,ids){
  var runs=[];
  for(var i=a;i<b;i++){var e=chars[i],r=runs[runs.length-1];if(r&&r.n===e.n&&e.k>=r.k1)r.k2=e.k+1;else runs.push({n:e.n,k1:e.k,k2:e.k+1})}
  runs.reverse().forEach(function(r){
    var t=r.n;if(r.k2<t.nodeValue.length)t.splitText(r.k2);
    var mid=r.k1>0?t.splitText(r.k1):t,m=document.createElement('mark');
    m.className='hl';m.setAttribute('data-f',ids.join(' '));mid.parentNode.insertBefore(m,mid);m.appendChild(mid);
  });
}
function hlApply(root,hs){
  if(!hs.length)return;
  var chars=hlChars(root),hay=chars.map(function(e){return e.c}).join(''),rs=[];
  hs.forEach(function(x){var r=hlFind(hay,x.h);if(r)rs.push([r[0],r[1],[x.id]])});
  if(!rs.length)return;
  rs.sort(function(x,y){return x[0]-y[0]});
  var m=[rs[0]];
  for(var i=1;i<rs.length;i++){var l=m[m.length-1];if(rs[i][0]<=l[1]){l[1]=Math.max(l[1],rs[i][1]);l[2]=l[2].concat(rs[i][2])}else m.push(rs[i])}
  m.reverse().forEach(function(r){hlWrap(chars,r[0],r[1],r[2])});
}
function hlUnwrap(root){
  $$('mark.hl',root).forEach(function(m){var p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize()});
}

/* ---------- ESCANEAR TEXTO (con la cámara del teléfono) ---------- */
function ocrBtns(){
  return '';
}
Object.assign(ACT,{
  'scan-text':function(){
    var n=$('#f-nota');if(!n)return;n.focus();
    try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}
    toast('Toca el ícono de escanear texto del teclado');
  },
  'paste-nota':async function(){
    var n=$('#f-nota');if(!n)return;
    try{
      var t=((await navigator.clipboard.readText())||'').trim();
      if(!t){toast('No hay texto copiado');return}
      var had=n.value.trim();n.value=had?had+'\n\n'+t:t;
      if(!had){var r=$('input[name="f-tipo"][value="Textual"]');if(r)r.checked=true}
      toast('Texto añadido a la nota');
    }catch(e){n.focus();toast('Mantén pulsado en la nota y elige Pegar')}
  }
});
